<template>
    <lightning-card title="Two-Way Data Binding">
        <div class="slds-var-m-around_medium">
            <lightning-input type="text" label="Enter Course Name:- " onchange={changeHandler}>
            </lightning-input>
            <div>{fullName} is a course of {title}</div>
        </div>
    </lightning-card>

    <lightning-card title="@track Properties">
        <div class="slds-var-m-around_medium">
            <lightning-input type="text" label="Enter City Name:- " onchange={trackHandler}>
            </lightning-input>
            <div>{address.city} is the city you are seeing on the screen</div>
        </div>
    </lightning-card>

    <lightning-card title="Getter Demo">
        <div class="slds-var-m-around_medium">
            <div>First User Name is: {firstUser}</div>
            <div>Multiplication of {num1} and {num2} is: {multiply}</div>
        </div>
    </lightning-card>
</template>
