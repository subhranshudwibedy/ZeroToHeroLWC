<template>
    <lightning-card title="Navigate to Record">
        <div class="slds-m-around_medium">
            <lightning-button variant="brand" label="New Record" onclick={navigateToRecord}></lightning-button>
        </div>
    </lightning-card>

    <lightning-card title="Navigate to Record with Default Values">
        <div class="slds-m-around_medium">
            <lightning-button variant="brand" label="New Record Default" onclick={navigateToRecordWithDefault}></lightning-button>
        </div>
    </lightning-card>

    <lightning-card title="Navigate to List Views">
        <div class="slds-m-around_medium">
            <lightning-button variant="brand" label="List View" onclick={navigateToListView}></lightning-button>
        </div>
    </lightning-card>

    <lightning-card title="Navigate to Files">
        <div class="slds-m-around_medium">
            <lightning-button variant="brand" label="Navigate to Files" onclick={navigateToFiles}></lightning-button>
        </div>
    </lightning-card>
</template>
